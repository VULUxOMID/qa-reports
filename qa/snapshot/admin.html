<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VULU Staff</title>
  <link rel="icon" href="/admin/favicon.svg" type="image/svg+xml" />
  <script>window.VULU_ADMIN_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsudnVsdS5kZXYk";window.VULU_ADMIN_CLERK_TOKEN_TEMPLATE = "vulu-backend";window.VULU_ADMIN_BETA_CATEGORY_ENABLE = true;</script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050706;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(69, 224, 131, 0.24), transparent 34rem),
        linear-gradient(180deg, rgba(6, 8, 7, 0.74), #050706),
        #050706;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 10px 10px;
      mask-image: radial-gradient(circle at 50% 45%, black, transparent 72%);
      opacity: 0.45;
      pointer-events: none;
    }
    .staff-card {
      position: relative;
      z-index: 1;
      width: min(92vw, 430px);
      min-height: 390px;
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 26px;
      background: rgba(12, 20, 17, 0.72);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }
    .mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      background: rgba(69, 224, 131, 0.12);
      border: 1px solid rgba(69, 224, 131, 0.32);
      color: #45e083;
      font-weight: 800;
      letter-spacing: 0;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.08;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      max-width: 32rem;
      color: rgba(248, 250, 252, 0.72);
      font-size: 15px;
      line-height: 1.5;
    }
    .status {
      min-height: 28px;
      color: rgba(248, 250, 252, 0.62);
      font-size: 13px;
    }
    .button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: #45e083;
      color: #06100a;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .button.secondary {
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: #f8fafc;
    }
    .signin-slot {
      margin-top: 2px;
      min-height: 64px;
    }
    .hidden { display: none; }
    @media (max-width: 520px) {
      .staff-card {
        min-height: 100vh;
        width: 100vw;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        padding: 28px;
      }
    }
  </style>
</head>
<body>
  <main class="staff-card" aria-live="polite">
    <div class="mark">V</div>
    <div>
      <h1 id="title">Staff access required</h1>
      <p id="copy">Sign in with an approved staff account to continue.</p>
    </div>
    <div class="status" id="status">Checking sign-in...</div>
    <button class="button secondary hidden" id="retry" type="button">Try again</button>
    <div class="signin-slot" id="signin"></div>
  </main>
  <script>
    (function () {
      var publishableKey = String(window.VULU_ADMIN_CLERK_PUBLISHABLE_KEY || "").trim();
      var tokenTemplate = String(window.VULU_ADMIN_CLERK_TOKEN_TEMPLATE || "").trim();
      var title = document.getElementById("title");
      var copy = document.getElementById("copy");
      var status = document.getElementById("status");
      var retry = document.getElementById("retry");
      var signIn = document.getElementById("signin");
      var mountedSignIn = false;

      function setPanel(nextTitle, nextCopy, nextStatus) {
        title.textContent = nextTitle;
        copy.textContent = nextCopy;
        status.textContent = nextStatus || "";
      }

      function decodeClerkFrontendApi(key) {
        var encoded = String(key || "").split("_")[2];
        encoded = encoded ? encoded.split("$")[0] : "";
        if (!encoded) return "";
        var padded = encoded.padEnd(encoded.length + ((4 - (encoded.length % 4)) % 4), "=");
        try {
          return atob(padded).replace(/\$$/, "");
        } catch (error) {
          return "";
        }
      }

      function loadScriptOnce(src, attrs) {
        return new Promise(function (resolve, reject) {
          var existing = Array.from(document.scripts).find(function (script) { return script.src === src; });
          if (existing) {
            if (existing.dataset.loaded === "true") {
              resolve();
              return;
            }
            existing.addEventListener("load", function () { resolve(); }, { once: true });
            existing.addEventListener("error", function () { reject(new Error("Failed to load sign-in.")); }, { once: true });
            return;
          }
          var script = document.createElement("script");
          script.src = src;
          script.defer = true;
          script.crossOrigin = "anonymous";
          Object.entries(attrs || {}).forEach(function (entry) { script.setAttribute(entry[0], entry[1]); });
          script.addEventListener("load", function () {
            script.dataset.loaded = "true";
            resolve();
          }, { once: true });
          script.addEventListener("error", function () { reject(new Error("Failed to load sign-in.")); }, { once: true });
          document.head.appendChild(script);
        });
      }

      async function loadClerk() {
        var frontendApi = decodeClerkFrontendApi(publishableKey);
        if (!publishableKey || !frontendApi) {
          throw new Error("Staff sign-in is not configured yet.");
        }
        if (!window.Clerk || !window.Clerk.load || !window.__internal_ClerkUICtor) {
          await Promise.all([
            loadScriptOnce("https://" + frontendApi + "/npm/@clerk/ui@1/dist/ui.browser.js"),
            loadScriptOnce("https://" + frontendApi + "/npm/@clerk/clerk-js@6/dist/clerk.browser.js", {
              "data-clerk-publishable-key": publishableKey
            })
          ]);
        }
        if (!window.Clerk || !window.Clerk.load) {
          throw new Error("Staff sign-in could not start.");
        }
        await window.Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
        return window.Clerk;
      }

      async function getStaffToken(clerk) {
        if (!clerk.session || !clerk.session.getToken) return "";
        if (tokenTemplate) {
          var templated = await clerk.session.getToken({ template: tokenTemplate, skipCache: true }).catch(function () { return ""; });
          if (templated) return templated;
        }
        return await clerk.session.getToken({ skipCache: true }).catch(function () { return ""; });
      }

      function mountSignIn(clerk) {
        if (mountedSignIn) return;
        mountedSignIn = true;
        setPanel("Staff access required", "Sign in with an approved staff account to continue.", "");
        clerk.mountSignIn(signIn);
      }

      async function verifyStaff(clerk) {
        setPanel("Checking staff access", "Your account is signed in. VULU is checking staff access now.", "One moment...");
        retry.classList.add("hidden");
        var token = await getStaffToken(clerk);
        if (!token) throw new Error("Could not get a staff sign-in token.");
        var response = await fetch("/api/admin/session", {
          method: "GET",
          cache: "no-store",
          credentials: "include",
          headers: { Authorization: "Bearer " + token }
        });
        if (response.ok) {
          window.location.replace("/admin/private/" + (window.location.hash || ""));
          return;
        }
        if (response.status === 401 || response.status === 403) {
          setPanel("Staff access required", "This account is signed in, but it is not approved for VULU staff tools.", "");
          retry.textContent = "Use another account";
          retry.classList.remove("hidden");
          retry.onclick = async function () {
            await clerk.signOut().catch(function () {});
            window.location.reload();
          };
          return;
        }
        throw new Error("Staff check failed. Please try again.");
      }

      async function sync(clerk) {
        if (!clerk.user) {
          mountSignIn(clerk);
          return;
        }
        await verifyStaff(clerk);
      }

      async function tryAdminAgentSession() {
        try {
          var response = await fetch("/api/admin/session", {
            method: "GET",
            cache: "no-store",
            credentials: "include"
          });
          if (!response.ok) return false;
          var payload = await response.json();
          if (!payload || payload.auth !== "agent_session") return false;
          window.location.replace("/admin/private/" + (window.location.hash || ""));
          return true;
        } catch (error) {
          return false;
        }
      }

      async function start() {
        try {
          retry.classList.add("hidden");
          if (await tryAdminAgentSession()) return;
          var clerk = await loadClerk();
          await sync(clerk);
          if (clerk.addListener) clerk.addListener(function () { sync(clerk); });
        } catch (error) {
          setPanel("Staff access required", "Sign in with an approved staff account to continue.", error && error.message ? error.message : "Staff sign-in failed.");
          retry.textContent = "Try again";
          retry.classList.remove("hidden");
          retry.onclick = function () { window.location.reload(); };
        }
      }

      start();
    })();
  </script>
</body>
</html>
